name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  verifier:
    name: Typage, style, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer
        run: pnpm install --frozen-lockfile

      # apps/api/src/genere/ est dans .gitignore : le client Prisma est un
      # artefact, pas une source. Le runner part d'un dépôt propre, il doit
      # donc le générer avant tout typage — sinon `tsc` ne trouve pas ses types.
      # `pnpm exec` à la racine, et non `--filter @jp/api` : le paquet `prisma`
      # est une devDependency de la RACINE, et prisma.config.ts y déclare
      # `schema: 'prisma/schema.prisma'`, résolu depuis la racine.
      - name: Générer le client Prisma
        run: pnpm exec prisma generate

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Format
        run: pnpm format:verifier

      - name: Typage
        run: pnpm typecheck

      - name: Style et règles de dépendance
        run: pnpm lint

      # Une règle d'architecture qui ne déclenche rien donne l'illusion d'une
      # garantie. Celle-ci est mise à l'épreuve, dans les deux sens.
      - name: Les règles de dépendance mordent-elles ?
        run: pnpm archi

      - name: Tests
        run: pnpm test

      - name: Construction
        run: pnpm build

  audit-securite:
    name: Audit de sécurité des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer
        run: pnpm install --frozen-lockfile

      # --audit-level=high : n'échoue que sur les vulnérabilités hautes/critiques,
      # pour éviter que le CI casse à chaque vulnérabilité mineure/théorique.
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  scan-secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks doit lire tout l'historique, pas juste le dernier commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verifier-changeset:
    name: Un changeset accompagne-t-il la pull request ?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sur un push vers master, la question n'a pas de sens : il n'y a plus de
    # branche à comparer, et c'est release.yml qui prend le relais.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/master` passe par git diff. Sans
          # l'historique complet, la référence origin/master n'existe pas sur
          # le runner et la comparaison n'a rien à quoi se rattacher.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer
        run: pnpm install --frozen-lockfile

      # Le même script que celui qu'on lance en local — une vérification de CI
      # qu'on ne sait pas reproduire sur sa machine est une vérification qu'on
      # ne sait pas déboguer. Échoue si la branche touche un paquet sans le
      # décrire ; `pnpm changeset --empty` est la sortie explicite prévue.
      - name: Un changeset est-il présent ?
        run: pnpm changeset:etat

  couverture-du-plan:
    name: Couverture backlog ↔ plan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Le plan est un livrable : une fonctionnalité ajoutée au backlog sans
      # mini-plan, ou un mini-plan orphelin, fait échouer l'intégration.
      - name: Vérifier la couverture
        run: node scripts/check-coverage.mjs
