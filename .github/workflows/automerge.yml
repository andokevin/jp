name: Fusion automatique

# Toutes les heures. GitHub ne garantit pas la ponctualité d'un `schedule` :
# en période de charge, le déclenchement peut glisser de plusieurs minutes.
# C'est sans importance ici — la fusion n'est pas urgente à la seconde.
#
# `workflow_dispatch` permet de le lancer à la demande depuis l'onglet Actions,
# sans attendre l'heure ronde. Indispensable pour l'éprouver.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Deux passes simultanées tenteraient de fusionner la même pull request.
concurrency:
  group: fusion-automatique
  cancel-in-progress: false

permissions: {}

jobs:
  fusionner:
    name: Fusionner les pull requests vertes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # écrire la fusion sur master
      pull-requests: write # fermer la pull request fusionnée

    steps:
      # Aucun `checkout` : tout passe par l'API. Cloner 26 000 lignes pour
      # lire un état de pull request serait du gaspillage.
      - name: Fusionner ce qui est prêt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Les pull requests ouvertes vers master, brouillons exclus.
          # Un brouillon est une intention, pas une demande de fusion.
          PRS=$(gh pr list --repo "$DEPOT" --base master --state open \
                  --json number,isDraft \
                  --jq '.[] | select(.isDraft == false) | .number')

          if [ -z "$PRS" ]; then
            echo "Aucune pull request ouverte vers master."
            exit 0
          fi

          # LES CONTRÔLES QUI DOIVENT AVOIR RÉUSSI, NOMMÉMENT.
          #
          # « Au moins un contrôle au vert » ne suffit pas, et le cas s'est
          # présenté dès le premier jour : la pull request de version portait
          # UNIQUEMENT un contrôle CodeRabbit au vert, tandis que la CI, elle,
          # avait échoué — sans apparaître dans statusCheckRollup. La règle
          # l'aurait fusionnée.
          #
          # Le contrôle d'un robot de relecture n'est pas la CI. On exige donc
          # ces jobs PAR LEUR NOM. Un job renommé bloque tout : c'est le bon
          # sens de l'échec.
          CONTROLES_REQUIS=(
            "Typage, style, tests"
            "Audit de sécurité des dépendances"
            "Scan de secrets"
            "Couverture backlog ↔ plan"
          )

          FUSIONNEES=0

          for N in $PRS; do
            DONNEES=$(gh pr view "$N" --repo "$DEPOT" \
                        --json title,mergeable,statusCheckRollup)
            TITRE=$(echo "$DONNEES" | jq -r '.title')
            echo "── #$N — $TITRE"

            # MERGEABLE | CONFLICTING | UNKNOWN. UNKNOWN signifie que GitHub
            # calcule encore la fusion : on repasse dans une heure plutôt que
            # de forcer sur un état qu'on ne connaît pas.
            FUSIONNABLE=$(echo "$DONNEES" | jq -r '.mergeable')
            if [ "$FUSIONNABLE" != "MERGEABLE" ]; then
              echo "   ignorée — état de fusion : $FUSIONNABLE"
              continue
            fi

            TOTAL=$(echo "$DONNEES" | jq '[.statusCheckRollup[]?] | length')

            # Chaque contrôle requis doit être PRÉSENT et au vert. « ABSENT »
            # est traité comme un échec : une pull request ouverte par
            # GITHUB_TOKEN ne déclenche aucun workflow, donc aucun de ces
            # contrôles n'existe — et elle ne doit pas partir toute seule.
            MANQUANTS=0
            for C in "${CONTROLES_REQUIS[@]}"; do
              ETAT=$(echo "$DONNEES" | jq -r --arg c "$C" '
                [ .statusCheckRollup[]?
                  | select((.name // .context // "") == $c)
                  | (.conclusion // .state // "PENDING") ] | first // "ABSENT"')
              if [ "$ETAT" != "SUCCESS" ]; then
                echo "   requis non satisfait — $C → $ETAT"
                MANQUANTS=$((MANQUANTS + 1))
              fi
            done

            if [ "$MANQUANTS" -ne 0 ]; then
              echo "   ignorée — $MANQUANTS contrôle(s) requis sur ${#CONTROLES_REQUIS[@]} non satisfait(s)"
              continue
            fi

            # Un CheckRun porte `conclusion`, un StatusContext porte `state` :
            # on lit l'un ou l'autre. Un contrôle encore en cours n'a ni l'un
            # ni l'autre et retombe donc sur PENDING, qui n'est pas vert.
            #
            # NEUTRAL et SKIPPED comptent comme verts : un job non exécuté
            # parce que sa condition `if:` était fausse n'a rien cassé.
            NON_VERTS=$(echo "$DONNEES" | jq -r '
              [ .statusCheckRollup[]?
                | (.conclusion // .state // "PENDING")
                | select(. as $e | ["SUCCESS","NEUTRAL","SKIPPED"] | index($e) | not)
              ] | length')

            if [ "$NON_VERTS" -ne 0 ]; then
              echo "   ignorée — $NON_VERTS contrôle(s) sur $TOTAL pas au vert :"
              echo "$DONNEES" | jq -r '
                .statusCheckRollup[]?
                | "     · \(.name // .context // "?") → \(.conclusion // .state // "PENDING")"'
              continue
            fi

            # --merge et non --squash : les messages de commit de ce dépôt
            # portent le raisonnement des décisions. Les écraser reviendrait
            # à jeter la seule trace de POURQUOI le code est ce qu'il est.
            echo "   $TOTAL contrôle(s) au vert — fusion"
            gh pr merge "$N" --repo "$DEPOT" --merge
            FUSIONNEES=$((FUSIONNEES + 1))
          done

          echo
          echo "$FUSIONNEES pull request(s) fusionnée(s)."
